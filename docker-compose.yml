version: '3.8'

services:
  # 1. LA BASE DE DATOS
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: innovatech_db
    ports:
      - "5432:5432"
    networks:
      - mi-red
    volumes:
      - datos-db:/var/lib/postgresql/data

  # 2. BACKEND DESPACHOS
  back-despachos:
    build: 
      context: ./back-Despachos_SpringBoot
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/innovatech_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword
    networks:
      - mi-red
    depends_on:
      - db

  # 3. BACKEND VENTAS
  back-ventas:
    build: 
      context: ./back-Ventas_SpringBoot
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/innovatech_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=adminpassword
    networks:
      - mi-red
    depends_on:
      - db

  # 4. FRONTEND
  frontend:
    build: 
      context: ./front_despacho
    ports:
      - "8080:80"
    networks:
      - mi-red
    depends_on:
      - back-despachos
      - back-ventas

networks:
  mi-red:
    driver: bridge

volumes:
  datos-db:
    name: volumen_base_de_datos